# Lab for "Keycloak Token Exchange, Hands-On": https://iamfilip.dev/posts/keycloak-token-exchange/
#
#   docker compose up -d --wait          # start Keycloak, wait until it is healthy
#   docker compose run --rm terraform    # provision the demo realm with Terraform
#   ./exchange.sh                        # walk through every exchange from the post
#   docker compose --profile tools down -v   # remove everything, including Terraform state
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      # The image has no curl; bash's /dev/tcp is enough to ask the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  terraform:
    image: hashicorp/terraform:1.16.6
    profiles: ["tools"]
    depends_on:
      keycloak:
        condition: service_healthy
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        terraform init -input=false -lockfile=readonly -backend-config=path=/state/terraform.tfstate &&
        terraform apply -input=false -auto-approve
    environment:
      TF_DATA_DIR: /state/.terraform
      TF_VAR_keycloak_url: http://keycloak:8080
    volumes:
      # Read-only: provider cache and state go to the volume, nothing is written into your checkout.
      - ./terraform:/workspace:ro
      - terraform-state:/state

volumes:
  terraform-state:
