# Lab for "Keycloak Is Not Your Zero Trust Architecture": https://iamfilip.dev/posts/zero-trust-keycloak/
#
#   docker compose up -d --build --wait      # build the APIs, start Keycloak and both APIs
#   docker compose run --rm terraform        # provision the demo and partner realms
#   ./matrix.sh                              # run the acceptance matrix
#   docker compose --profile tools down -v   # remove everything, including Terraform state
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      # The image has no curl; bash's /dev/tcp is enough to ask the management port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  terraform:
    image: hashicorp/terraform:1.16.6
    profiles: ["tools"]
    depends_on:
      keycloak:
        condition: service_healthy
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        terraform init -input=false -lockfile=readonly -backend-config=path=/state/terraform.tfstate &&
        terraform apply -input=false -auto-approve
    environment:
      TF_DATA_DIR: /state/.terraform
      TF_VAR_keycloak_url: http://keycloak:8080
    volumes:
      # Read-only: provider cache and state go to the volume, nothing is written into your checkout.
      - ./terraform:/workspace:ro
      - terraform-state:/state

  # Both APIs run the same image. Each accepts only tokens whose aud is its own name.
  inventory-api:
    build: ./api
    environment: &api-environment
      API_NAME: inventory-api
      # Tokens in this lab are requested from the host, so their iss is localhost:8080.
      # The keys are fetched inside the Docker network. Both are configured, never read
      # from the token.
      ISSUER: http://localhost:8080/realms/demo
      JWKS_URL: http://keycloak:8080/realms/demo/protocol/openid-connect/certs
      ALLOWED_AZP: order-api
      LEEWAY: 5s
    ports:
      - "8081:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck: &api-healthcheck
      test: ["CMD", "/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-api:
    build: ./api
    environment:
      <<: *api-environment
      API_NAME: payment-api
    ports:
      - "8082:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck: *api-healthcheck

volumes:
  terraform-state:
